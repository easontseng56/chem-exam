<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>模考內部訓練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#14242b; --muted:#5b6d73; --line:#d5dfe1; --accent:#0f6e74; --accent-soft:#e1f0f0;
  --c0:#0f6e74; --c0-soft:#e1f0f0; --c1:#b0562a; --c1-soft:#fbece3; --c2:#2f5fb3; --c2-soft:#e6eefb; --c3:#6d4aa8; --c3-soft:#efe8fa; --c4:#2f7d4a; --c4-soft:#e4f3e9; --c5:#7a6a1f; --c5-soft:#f5f0d9; --c6:#a3365f; --c6-soft:#f9e6ee; --c7:#3f5f73; --c7-soft:#e5edf2; --c8:#6b5a4e; --c8-soft:#efe9e4;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a1e;--surface:#16252a;--ink:#e3eeef;--muted:#93a7ac;--line:#2a3d43;--accent:#5cc4c8;--accent-soft:#1c3a3e;
  --c0:#5cc4c8;--c0-soft:#1c3a3e;--c1:#f0a77f;--c1-soft:#3d2619;--c2:#8fb3f0;--c2-soft:#1d2b45;--c3:#c6a6ff;--c3-soft:#2c2240;--c4:#86cf9f;--c4-soft:#1b3326;--c5:#d9c46a;--c5-soft:#332d14;--c6:#f08fb4;--c6-soft:#3d1f2b;--c7:#9cc0d6;--c7-soft:#1e2c35;--c8:#cdb8a8;--c8-soft:#2f2722;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:32px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0}
.count{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--accent)}
.count b{font-size:22px}
.count .sub{font-weight:500;color:var(--muted);font-size:14px;margin-left:8px}
.term .subj{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.lede{color:var(--muted);margin:4px 0 0}
.lede a{color:var(--accent)}
.filters{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row span{font-size:13px;color:var(--muted);width:2.5em}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible,.sc:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{display:flex;flex-direction:column;gap:18px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 10px}
.term h2{font-size:18px;font-weight:700;margin:0 0 6px;color:var(--ink)}
.grow{display:grid;grid-template-columns:4.6em 1fr;gap:8px;align-items:start;padding:5px 0;border-top:1px solid var(--line)}
.grow:first-of-type{border-top:0}
.gt{font-size:13px;font-weight:700;text-align:center;padding:4px 0;border-radius:6px}
.gt.g0{color:var(--c0);background:var(--c0-soft)}.gt.g1{color:var(--c1);background:var(--c1-soft)}.gt.g2{color:var(--c2);background:var(--c2-soft)}
.gt.g3{color:var(--c3);background:var(--c3-soft)}.gt.g4{color:var(--c4);background:var(--c4-soft)}.gt.g5{color:var(--c6);background:var(--c6-soft)}.gt.g6{color:var(--c7);background:var(--c7-soft)}.gt.g7{color:var(--c8);background:var(--c8-soft)}.gt.g8{color:var(--c5);background:var(--c5-soft)}
.schools{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:14px;padding:3px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.sc:hover{border-color:var(--accent);background:var(--accent-soft)}
.none{font-size:14px;color:var(--muted);padding-top:3px}
.about,.offer{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.about h2,.offer h2{font-family:var(--display);font-weight:900;font-size:20px;margin:0}
.about h3{font-size:16px;margin:4px 0 0}
.about p,.offer p{margin:0;max-width:65ch}
.about dl{margin:0;display:flex;flex-direction:column;gap:8px}
.about dt{font-weight:700}
.about dd{margin:0;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--bg)}
.info{display:flex;flex-direction:column;gap:4px;font-size:14px}
.info p{margin:0}
.info a{color:var(--accent)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>

<style>
.lock{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px;max-width:420px}
.lock form{display:flex;gap:8px;flex-wrap:wrap}
.lock input{font:inherit;flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lock button{font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
#err{margin:0;font-size:14px;color:#c0392b;min-height:1.4em}
.grow>div{min-width:0}
.sc.nolink{color:var(--muted);border-style:dashed}
.sc.nolink:hover{border-color:var(--line);background:var(--bg)}
.qx{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.qx summary{cursor:pointer;font-size:14px;font-weight:700;padding:6px 10px;color:var(--accent)}
.qnote{margin:0 10px 6px;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;padding:0 10px 10px}
.qx table{border-collapse:collapse;font-size:13px;width:100%;min-width:520px}
.qx th,.qx td{border-top:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.qx th{color:var(--muted);font-weight:500;white-space:nowrap}
.qx td:nth-child(-n+2){white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>模考內部訓練</h1>
  <p class="count" id="cnt" hidden>共 <b id="total"></b> 回<span class="sub" id="split"></span></p>
  <p class="lede">僅供團隊內部訓練使用，請勿轉傳網址、密碼或檔案。</p>
</header>
<section class="lock" id="lock">
  <p>請輸入密碼</p>
  <form id="pwf"><input id="pw" type="password" autocomplete="current-password" aria-label="密碼"><button type="submit">進入</button></form>
  <p id="err" role="status"></p>
</section>
<nav class="filters" aria-label="篩選" hidden>
  <div class="row" id="ft"><span>考試</span></div>
  <div class="row" id="fy"><span>學年</span></div>
  <div class="row" id="fg"><span>出版</span></div>
</nav>
<main id="list" hidden></main>
<footer>題目與解答版權屬各出版社及各區模考單位，僅限內部訓練，不得公開或商業使用。</footer>
</div>

const GROUPS=["翰林","南一","臺北區","臺中區","文昌","銓達","南區","學校","高二複習"];
let SETS;
const st={t:'學測',y:'',g:''};
const $=s=>document.querySelector(s);
function chips(id,key,vals,fmt,all){const r=$(id);r.querySelectorAll('.chip').forEach(c=>c.remove());(all?['']:[]).concat(vals).forEach(v=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=v?fmt(v):'全部';b.setAttribute('aria-pressed',v===st[key]);b.onclick=()=>{st[key]=v;r.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));if(key==='t'){st.y='';st.g='';filters()}render()};r.appendChild(b)})}
function cur(){return SETS[st.t].data}
function filters(){const D=cur();chips('#fy','y',[...new Set(D.map(d=>d.y))].sort((a,b)=>b-a),v=>v,1);chips('#fg','g',GROUPS.filter(g=>D.some(d=>d.g===g)),v=>v,1)}
function render(){
  const D=cur(),lab=SETS[st.t].label;
  const ys=[...new Set(D.map(d=>d.y))].sort((a,b)=>b-a).filter(y=>!st.y||y===st.y);
  const gs=GROUPS.filter(g=>!st.g||g===st.g);
  let html='';
  ys.forEach(y=>{
    const rows=gs.map(g=>{
      const ds=D.filter(d=>d.y===y&&d.g===g).sort((a,b)=>a.k-b.k);
      if(!ds.length) return '';
      const gi=GROUPS.indexOf(g);
      const tip=d=>`${y} 學年度 ${d.full} ${lab}${d.subj?'（'+d.subj+'）':''}`;
      const chip=d=>d.u?`<a class="sc" href="${d.u}" target="_blank" rel="noopener noreferrer" title="${tip(d)}">${d.n}</a>`:`<span class="sc nolink" title="${tip(d)}（不提供題目檔）">${d.n}</span>`;
      const qx=ds.filter(d=>d.q&&d.q.length).map(d=>`<details class="qx"><summary>${d.full} 化學題答案與分類（${d.q.length} 題）</summary><p class="qnote">只列題號、答案與分類，題目請看紙本原卷。</p><div class="tw"><table><thead><tr><th>題號</th><th>題型</th><th>答案</th><th>主分類</th><th>次分類</th><th>標記</th></tr></thead><tbody>${d.q.map(q=>`<tr><td>${q.n}</td><td>${q.t}</td><td>${q.a}</td><td>${q.m}</td><td>${q.s||'—'}</td><td>${q.x||''}</td></tr>`).join('')}</tbody></table></div></details>`).join('');
      return `<div class="grow"><div class="gt g${gi}">${g}</div><div><div class="schools">${ds.map(chip).join('')}</div>${qx}</div></div>`;
    }).join('');
    if(rows) html+=`<section class="term"><h2>${y} 學年度${st.t==='分科'?' 分科模考':''}</h2>${rows}</section>`;
  });
  $('#list').innerHTML=html||'<p class="none">這個條件下沒有模考。</p>';
}
function start(data){
  SETS={'學測':{data:data.a,label:'學測模擬考'},'分科':{data:data.b,label:'分科測驗模擬考'}};
  $('#total').textContent=data.a.length+data.b.length;
  $('#split').textContent=`學測 ${data.a.length} 回、分科 ${data.b.length} 回`;
  $('#lock').hidden=true;$('#cnt').hidden=false;$('.filters').hidden=false;$('#list').hidden=false;
  chips('#ft','t',['學測','分科'],v=>v+'模考',0);filters();render();
}
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(ENC.i)},key,ub(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
$('#pwf').onsubmit=async e=>{
  e.preventDefault();const err=$('#err');err.textContent='解鎖中…';
  const pw=$('#pw').value.trim();
  try{const d=await unlock(pw);try{sessionStorage.setItem('mpw',pw)}catch(_){}err.textContent='';start(d)}catch(_){err.textContent='密碼錯誤，請再試一次。'}
};
