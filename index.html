<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新竹高中化學段考題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: masthead, filter chips, then one band per exam with school tiles laid out like periodic-table cells */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#14242b; --muted:#5b6d73; --line:#d5dfe1; --accent:#0f6e74; --accent-soft:#e1f0f0;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a1e;--surface:#16252a;--ink:#e3eeef;--muted:#93a7ac;--line:#2a3d43;--accent:#5cc4c8;--accent-soft:#1c3a3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1e;--surface:#16252a;--ink:#e3eeef;--muted:#93a7ac;--line:#2a3d43;--accent:#5cc4c8;--accent-soft:#1c3a3e;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:40px 64px;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters span{font-size:13px;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.exam{display:flex;flex-direction:column;gap:14px}
.exam h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;text-wrap:balance}
.exam h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.cell{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.cell:hover{border-color:var(--accent);background:var(--accent-soft)}
.cell .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cell .sym{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.1;color:var(--accent)}
.cell .name{font-weight:700}
.cell .go{font-size:12px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Chemistry · 段考題目</div>
  <h1>新竹高中化學段考題庫</h1>
  <p class="lede">各校化學段考的題目卷，點學校就能在雲端硬碟開啟 PDF，可線上看或下載練習。詳解請洽老師。</p>
</header>
<nav class="filters" aria-label="篩選">
  <span>年級</span>
  <button class="chip" type="button" id="g-all" data-g="" aria-pressed="true">全部</button>
  <button class="chip" type="button" id="g-1" data-g="高一" aria-pressed="false">高一</button>
  <button class="chip" type="button" id="g-2" data-g="高二" aria-pressed="false">高二</button>
</nav>
<main id="list"></main>
<footer>題目整理自各校公開段考卷，僅供學習使用。</footer>
</div>
<script>
const DATA=[{"y": "114", "s": "一", "g": "高一", "sc": "建功", "u": "https://drive.google.com/file/d/1j1nNKboprb1K-lhCq_sWNTQ-3Dy7kikQ/view"}, {"y": "114", "s": "一", "g": "高一", "sc": "竹女", "u": "https://drive.google.com/file/d/116dbcyVnJIc2hn6iFe-tzP6hhKoKce1a/view"}, {"y": "114", "s": "一", "g": "高一", "sc": "義民", "u": "https://drive.google.com/file/d/1VcLhz6DZE7F-mZX0CmqGV5Sd6S9f0ick/view"}, {"y": "114", "s": "一", "g": "高二", "sc": "六家", "u": "https://drive.google.com/file/d/1lZb_0jJ_UFi7RIG4wAQPpv18GBkfMoTf/view"}, {"y": "114", "s": "一", "g": "高二", "sc": "實驗", "u": "https://drive.google.com/file/d/1Be6J3BSmHQ-ZkIhTJHYlpIQ_x_9loN-r/view"}, {"y": "114", "s": "一", "g": "高二", "sc": "建功", "u": "https://drive.google.com/file/d/1-XcWicoNpbCweH5GW79ohiiHPC9J20F-/view"}, {"y": "114", "s": "一", "g": "高二", "sc": "竹中", "u": "https://drive.google.com/file/d/1Y8Z_dGv_jKi2wucZyHNt9J4C1owTLoBc/view"}, {"y": "114", "s": "一", "g": "高二", "sc": "竹女", "u": "https://drive.google.com/file/d/1VI_PZRBj-UlBGCA6VvoptH_Nde0wfIsG/view"}, {"y": "114", "s": "二", "g": "高一", "sc": "光復", "u": "https://drive.google.com/file/d/17g6F5AJGZ9Rbp_xbZ74JB0DgqpYXY9sj/view"}, {"y": "114", "s": "二", "g": "高一", "sc": "實驗", "u": "https://drive.google.com/file/d/1jKRC9Y2dpPijRHoiE7stgo-xNWdeJra7/view"}, {"y": "114", "s": "二", "g": "高一", "sc": "磐石", "u": "https://drive.google.com/file/d/1_EMRsoYQ8s1UwTxXzoDvzmf-n6x4alCM/view"}, {"y": "114", "s": "二", "g": "高一", "sc": "竹北", "u": "https://drive.google.com/file/d/1ZDMuNpAnZ9-7sbYiigI6CYhTvFdvY23t/view"}, {"y": "114", "s": "二", "g": "高一", "sc": "竹商", "u": "https://drive.google.com/file/d/1AzOmWDNsyddfVj2uvCTROnqVFouNoIsL/view"}, {"y": "114", "s": "二", "g": "高一", "sc": "竹東", "u": "https://drive.google.com/file/d/11dO1KoF95MNswy5vfWwPCROdPhjnREZJ/view"}, {"y": "113", "s": "一", "g": "高一", "sc": "六家", "u": "https://drive.google.com/file/d/1rRdRMHwHvo1egfl3UmNdg1xreId6B_4s/view"}, {"y": "113", "s": "一", "g": "高一", "sc": "建功", "u": "https://drive.google.com/file/d/1h4E18el3HrpnXlyYQ0Vscw-LXFgKQj_U/view"}, {"y": "113", "s": "一", "g": "高一", "sc": "竹中", "u": "https://drive.google.com/file/d/1L0sauuvrc10UlqtYp8PyrQ-d3cNeH8AB/view"}, {"y": "113", "s": "一", "g": "高一", "sc": "竹北", "u": "https://drive.google.com/file/d/1DmR_qoVOyKYc8G8Bfqp8psu1wcFhkTmB/view"}, {"y": "113", "s": "一", "g": "高一", "sc": "竹女", "u": "https://drive.google.com/file/d/1zDfl1BoU9mMrzPhy8t3KylXOXxasEX3j/view"}, {"y": "113", "s": "一", "g": "高一", "sc": "竹東", "u": "https://drive.google.com/file/d/1yIKQqErN4M6_AVdKal39tDnkGxeQanFG/view"}, {"y": "113", "s": "一", "g": "高二", "sc": "六家", "u": "https://drive.google.com/file/d/1zfuEnn_B95F0SAKioqPj-OcTGvH6oU13/view"}, {"y": "113", "s": "一", "g": "高二", "sc": "建功", "u": "https://drive.google.com/file/d/1rXACroDI1rbtuJZdou50Dh2AEc-8VavC/view"}, {"y": "113", "s": "一", "g": "高二", "sc": "竹中", "u": "https://drive.google.com/file/d/1fVeT5niZDAKj7eHiD4QzDXGTsBufubFu/view"}, {"y": "113", "s": "一", "g": "高二", "sc": "竹北", "u": "https://drive.google.com/file/d/113LmHwsmyAEUQMhjuvT_RHDd_34htjTq/view"}, {"y": "113", "s": "一", "g": "高二", "sc": "竹女", "u": "https://drive.google.com/file/d/1SGKABRDbVo7DlqIhe8Vh59rOcktGMxDb/view"}, {"y": "113", "s": "一", "g": "高二", "sc": "竹東", "u": "https://drive.google.com/file/d/1hU3G6pgpQyXGLyJY3_dcl2xjtkq4DpRa/view"}];
const list=document.getElementById('list');
function render(g){
  const groups={};
  DATA.filter(d=>!g||d.g===g).forEach(d=>{const k=d.y+'|'+d.s+'|'+d.g;(groups[k]=groups[k]||[]).push(d)});
  const keys=Object.keys(groups).sort((a,b)=>{const[ya,sa,ga]=a.split('|'),[yb,sb,gb]=b.split('|');return yb-ya||(sb>sa?1:sb<sa?-1:0)||ga.localeCompare(gb)});
  list.innerHTML='';list.style.cssText='display:flex;flex-direction:column;gap:32px';
  keys.forEach(k=>{
    const[y,s,gr]=k.split('|');const items=groups[k];
    const sec=document.createElement('section');sec.className='exam';
    sec.innerHTML=`<h2>${y} 學年度 第${s}學期 第一次段考・${gr}<small>${items.length} 所學校</small></h2><div class="grid"></div>`;
    const grid=sec.querySelector('.grid');
    items.forEach((d,i)=>{const a=document.createElement('a');a.className='cell';a.href=d.u;a.target='_blank';a.rel='noopener';
      a.innerHTML=`<span class="no">${String(i+1).padStart(2,'0')}</span><span class="sym">${d.sc.slice(0,1)}</span><span class="name">${d.sc}</span><span class="go">開啟題目 PDF ↗</span>`;grid.appendChild(a)});
    list.appendChild(sec)});
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render(b.dataset.g)}));
render('');
</script>
</body>
</html>
