<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>新竹高中化學段考解答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: title, filter rows (學年/年級/學校), then per term a card with one block per exam and a colored row per grade */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#14242b; --muted:#5b6d73; --line:#d5dfe1; --accent:#0f6e74; --accent-soft:#e1f0f0;
  --g1:#2f5fb3; --g1-soft:#e6eefb; --g2:#2f7d4a; --g2-soft:#e4f3e9; --g3:#b0562a; --g3-soft:#fbece3;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a1e;--surface:#16252a;--ink:#e3eeef;--muted:#93a7ac;--line:#2a3d43;--accent:#5cc4c8;--accent-soft:#1c3a3e;--g1:#8fb3f0;--g1-soft:#1d2b45;--g2:#86cf9f;--g2-soft:#1b3326;--g3:#f0a77f;--g3-soft:#3d2619;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1e;--surface:#16252a;--ink:#e3eeef;--muted:#93a7ac;--line:#2a3d43;--accent:#5cc4c8;--accent-soft:#1c3a3e;--g1:#8fb3f0;--g1-soft:#1d2b45;--g2:#86cf9f;--g2-soft:#1b3326;--g3:#f0a77f;--g3-soft:#3d2619;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:32px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0}
.count{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--accent)}
.count b{font-size:22px}
.lede{color:var(--muted);margin:4px 0 0}
.lede a{color:var(--accent)}
.filters{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row span{font-size:13px;color:var(--muted);width:2.5em}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible,.sc:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{display:flex;flex-direction:column;gap:18px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 6px}
.term h2{font-size:18px;font-weight:700;margin:0 0 4px;color:var(--ink)}
.exam{padding:10px 0 8px;border-top:1px solid var(--line)}
.exam:first-of-type{border-top:0}
.exam h3{font-size:15px;font-weight:700;margin:0 0 6px;color:var(--accent);display:flex;align-items:center;gap:8px}
.exam h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.grow{display:grid;grid-template-columns:3.6em 1fr;gap:8px;align-items:start;padding:4px 0}
.gt{font-size:13px;font-weight:700;text-align:center;padding:4px 0;border-radius:6px}
.gt.高一{color:var(--g1);background:var(--g1-soft)}
.gt.高二{color:var(--g2);background:var(--g2-soft)}
.gt.高三{color:var(--g3);background:var(--g3-soft)}
.schools{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:14px;padding:3px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.sc:hover{border-color:var(--accent);background:var(--accent-soft)}
.none{font-size:14px;color:var(--muted);padding-top:3px}
.offer{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.offer h2{font-family:var(--display);font-weight:900;font-size:20px;margin:0}
.offer p{margin:0;max-width:65ch}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.way{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);min-width:0}
.way b{color:var(--accent)}
.contact{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--bg)}
.lock{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.lock form{display:flex;flex-wrap:wrap;gap:8px}
.lock input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);flex:1 1 180px;min-width:0}
.lock button{font:inherit;font-weight:700;padding:8px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.lock .err{color:#c0392b;margin:0;min-height:1.4em;font-size:14px}
[hidden]{display:none!important}
.info{display:flex;flex-direction:column;gap:4px;font-size:14px}
.info p{margin:0}
.info a{color:var(--accent)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>

function chips(id,key,vals){const box=document.getElementById(id);[['','全部'],...vals.map(v=>[v,v])].forEach(([v,t])=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t;b.setAttribute('aria-pressed',v===st[key]);b.onclick=()=>{st[key]=v;box.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render()};box.appendChild(b)})}
function render(){
  const list=document.getElementById('list');list.innerHTML='';
  const rows=DATA.filter(d=>(!st.y||d.y===st.y)&&(!st.sem||d.s===(st.sem==='上'?'一':'二')));
  const terms={};rows.forEach(d=>{const t=d.y+'|'+d.s;const k=(d.e||'一')+'|'+d.g;((terms[t]=terms[t]||{})[k]=terms[t][k]||[]).push(d)});
  const grades=st.g?[st.g]:['高三','高二','高一'];
  Object.keys(terms).sort((a,b)=>{const[ya,sa]=a.split('|'),[yb,sb]=b.split('|');return yb-ya||N[sb]-N[sa]}).forEach(t=>{
    const[y,s]=t.split('|');const sec=document.createElement('section');sec.className='term';
    sec.innerHTML=`<h2>${y} 學年度 第${s}學期</h2>`;
    ['三','二','一'].filter(e=>!st.ex||st.ex==='第'+e+'次').forEach(e=>{
      const ex=document.createElement('div');ex.className='exam';ex.innerHTML=`<h3>第${e}次段考</h3>`;
      grades.forEach(g=>{
        const r=document.createElement('div');r.className='grow';
        r.innerHTML=`<div class="gt ${g}">${g}</div><div class="schools"></div>`;
        const box=r.querySelector('.schools');const ds=(terms[t][e+'|'+g]||[]).filter(d=>!st.s||d.sc===st.s);
        if(!ds.length)box.innerHTML='<span class="none">無</span>';
        ds.forEach(d=>{const a=document.createElement('a');a.className='sc';a.href=d.u;a.target='_blank';a.rel='noopener';a.textContent=d.sc;box.appendChild(a)});
        ex.appendChild(r)});
      sec.appendChild(ex)});
    list.appendChild(sec)});
}
function start(){
  chips('fy','y',[...new Set(DATA.map(d=>d.y))].sort().reverse());
  chips('fsem','sem',['上','下']);
  chips('fex','ex',['第一次','第二次','第三次']);
  chips('fg','g',['高一','高二','高三']);
  const cnt={};DATA.forEach(d=>cnt[d.sc]=(cnt[d.sc]||0)+1);
  chips('fs','s',Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,'zh-Hant')));
  document.getElementById('lock').hidden=true;document.querySelector('.filters').hidden=false;document.getElementById('list').hidden=false;
  render();
}
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(ENC.i)},key,ub(ENC.c));
  DATA=JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById('total').textContent=125;
document.getElementById('pwf').onsubmit=async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='解鎖中…';
  const pw=document.getElementById('pw').value.trim();
  try{await unlock(pw);try{sessionStorage.setItem('apw',pw)}catch(_){}err.textContent='';start()}catch(_){err.textContent='密碼錯誤，請再試一次。'}
};
(async()=>{let pw=null;try{pw=sessionStorage.getItem('apw')}catch(_){}if(pw){try{await unlock(pw);start()}catch(_){}}})();
</script>
